spring.application.name=proxy-monitor
server.port=${PORT:8080}
spring.jackson.default-property-inclusion=non_null

# Origenes permitidos (separados por coma). En PROD: URL del frontend en Vercel.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
# Probabilidad de fallo intencional en PaymentService
app.payment.failure-rate=${PAYMENT_FAILURE_RATE:0.10}
app.logs.max-entries=5000
